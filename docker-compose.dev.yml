# Live-reload stack: bind-mounts the source into stock node images instead of
# building the Dockerfile's static bundle, so editing a file updates the
# running app. The party-night stack (docker-compose.yml) is untouched.
#
#   docker compose -f docker-compose.dev.yml up
#
# then open http://localhost:5173/ - that's Vite, with hot reload. The
# server restarts itself on save via Node's built-in --watch.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && node --watch src/index.js"
    environment:
      PORT: "3001"
      REDIS_URL: "redis://redis:6379"
      CORS_ORIGIN: "*"
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: "http://server:3001"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  redis-data:
  server-node-modules:
  client-node-modules:
